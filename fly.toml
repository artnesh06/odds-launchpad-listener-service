# Fly.io configuration for NFT Listener Service
app = "nft-listener-service"
primary_region = "sin" # Singapore - ganti sesuai region terdekat

[build]
  [build.args]
    NODE_VERSION = "20"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # Jangan auto-stop
  auto_start_machines = true
  min_machines_running = 1    # Minimal 1 machine selalu jalan

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[checks]
  [checks.alive]
    type = "tcp"
    interval = "15s"
    timeout = "10s"
