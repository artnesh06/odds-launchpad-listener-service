name: Deploy to Cloud Server

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

# Allow jobs to set their own permissions
permissions: {}

env:
  DOCKER_IMAGE: nft-listener-service
  CONTAINER_NAME: nft-listener

jobs:
  # Job 1: Security scanning
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  # Job 2: Build and push to GitHub Container Registry
  build:
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      environment: ${{ steps.set-env.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment based on branch
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "tag_suffix=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "tag_suffix=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.repository }}
          tags: |
            type=sha,format=long,prefix=${{ steps.set-env.outputs.tag_suffix }}-
            type=raw,value=${{ steps.set-env.outputs.tag_suffix }}-latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          outputs: type=registry
      
      - name: Image digest
        run: |
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # Job 3: Deploy to server
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ needs.build.outputs.environment }}
    concurrency:
      group: ${{ needs.build.outputs.environment }}-deploy
      cancel-in-progress: false
    
    steps:
      - name: Set environment variables
        id: set-vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag_suffix=prod" >> $GITHUB_OUTPUT
            echo "container_name=nft-listener" >> $GITHUB_OUTPUT
            echo "env_file=/opt/nft-listener-prod/.env" >> $GITHUB_OUTPUT
          else
            echo "tag_suffix=dev" >> $GITHUB_OUTPUT
            echo "container_name=nft-listener-dev" >> $GITHUB_OUTPUT
            echo "env_file=/opt/nft-listener/.env" >> $GITHUB_OUTPUT
          fi
          echo "deploy_path=/opt/nft-listener-prod" >> $GITHUB_OUTPUT

      - name: Lowercase repository name
        id: repo
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
        
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_REPOSITORY: ${{ steps.repo.outputs.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          CONTAINER_NAME: ${{ steps.set-vars.outputs.container_name }}
          TAG_SUFFIX: ${{ steps.set-vars.outputs.tag_suffix }}
          ENV_FILE: ${{ steps.set-vars.outputs.env_file }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GHCR_TOKEN,GITHUB_REPOSITORY,GITHUB_SHA,GITHUB_ACTOR,CONTAINER_NAME,TAG_SUFFIX,ENV_FILE
          script: |
            set -e
            
            echo "🔐 Login to GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            
            echo "📥 Pulling new image: $TAG_SUFFIX-$GITHUB_SHA..."
            docker pull ghcr.io/$GITHUB_REPOSITORY:$TAG_SUFFIX-$GITHUB_SHA
            
            echo "💾 Backing up current image..."
            docker tag ghcr.io/$GITHUB_REPOSITORY:$TAG_SUFFIX-latest ghcr.io/$GITHUB_REPOSITORY:$TAG_SUFFIX-rollback 2>/dev/null || true
            
            echo "🏷️  Tagging new image as latest..."
            docker tag ghcr.io/$GITHUB_REPOSITORY:$TAG_SUFFIX-$GITHUB_SHA ghcr.io/$GITHUB_REPOSITORY:$TAG_SUFFIX-latest
            
            echo "� Navigating to deployment path: /opt/nft-listener-prod"
            cd /opt/nft-listener-prod || { echo "❌ Failed to cd to /opt/nft-listener-prod"; exit 1; }
            
            echo "🚀 Deploying $CONTAINER_NAME service..."
            
            # Stop and remove old container completely
            echo "� Stopping and removing old container..."
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm -f $CONTAINER_NAME 2>/dev/null || true
            
            # Wait for cleanup
            sleep 5
            
            # Use docker-compose to recreate the service
            # This ensures proper DNS registration in Docker network
            echo "📦 Starting $CONTAINER_NAME with docker-compose..."
            if [[ "$TAG_SUFFIX" == "dev" ]]; then
              docker-compose up -d nft-listener-dev
            else
              docker-compose up -d nft-listener
            fi
            
            echo "⏳ Waiting for service to be healthy (30 seconds)..."
            sleep 30
            
            echo "🔍 Checking service health..."
            if docker exec $CONTAINER_NAME curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ Service is healthy!"
            else
              echo "⚠️  Warning: Health check failed, checking logs..."
              docker logs --tail 20 $CONTAINER_NAME
            fi
            
            echo "✅ Deployment successful!"
            if [[ "$TAG_SUFFIX" == "prod" ]]; then
              echo "🌐 Production service available at https://backend.oddslaunchpad.com"
              echo "📊 API Docs: https://backend.oddslaunchpad.com/api-docs"
            else
              echo "🌐 Development service available at https://dev.backend.oddslaunchpad.com"
              echo "📊 API Docs: https://dev.backend.oddslaunchpad.com/api-docs"
            fi
            
            echo "📊 Traefik Dashboard: http://213.136.94.62/dashboard/"
            
            # Cleanup old images
            echo "🧹 Cleaning up old images..."
            docker images ghcr.io/$GITHUB_REPOSITORY --format "{{.ID}} {{.Tag}} {{.CreatedAt}}" | \
              grep "$TAG_SUFFIX" | sort -k3 -r | tail -n +4 | awk '{print $1}' | xargs -r docker rmi 2>/dev/null || true
            
            echo "🎉 All done!"
            exit 0
